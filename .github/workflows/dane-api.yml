# Co godzinę odświeża dane API i publikuje je na GitHub Pages (statyczne pliki tekstowe).
# Pamięć podręczna źródeł (dane/*.json) jest commitowana z powrotem, żeby kolejne przebiegi
# pobierały tylko nowe dane (np. nowe serie obligacji raz w miesiącu).
name: dane-api

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dane-api
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pip install openpyxl pytest
      - name: Testy parserów
        run: python -m pytest -q tests
      - name: Budowa API
        run: python build_api.py
      - name: Zapis pamięci podręcznej
        if: always()
        run: |
          git config user.name "dane-api"
          git config user.email "dane-api@users.noreply.github.com"
          git add dane
          git diff --cached --quiet || git commit -m "dane: aktualizacja $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
